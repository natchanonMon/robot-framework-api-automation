name: Robot Framework API Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API Automation Tests
        run: robot -d results tests/

      - name: Upload Test Results (Report & Log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-api-test-results
          path: results/
